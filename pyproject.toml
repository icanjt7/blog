[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-auto-agent"
version = "0.1.0"
description = "Daily blog content planning, writing, review, and publishing agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "feedparser>=6.0.11",
  "google-auth>=2.29.0",
  "markdown>=3.6",
  "openai>=1.30.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "simple-justwatch-python-api>=0.19,<1",
  "streamlit>=1.36.0",
  "uvicorn>=0.30.0",
  "PyYAML>=6.0.1"
]

[project.scripts]
blog-agent = "blog_agent.cli:main"
toss-webhook = "blog_agent.toss_webhook:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blog_agent*"]

[tool.setuptools.package-data]
blog_agent = ["sources.yml", "product_reviews.json", "toss_products.json", "templates/*.html"]
