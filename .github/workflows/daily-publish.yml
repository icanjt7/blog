name: Daily blog publish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"  # 2시간마다 (하루 12회, 1포스트/회)

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pages: write
      id-token: write
      models: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Generate and publish posts
        env:
          # LLMs — first non-empty explicit key is used: Groq → Gemini → OpenRouter → OpenAI → GitHub Models.
          # GitHub Models is only a final fallback because GITHUB_TOKEN is always present in Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'Llama-3.3-70B-Instruct' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'groq/compound-mini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'meta-llama/llama-3.1-8b-instruct:free' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          # Free stock photo APIs — Unsplash(50/h) → Pexels(200/h) → Pixabay(100/min)
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOURAPI_GUIDE: ${{ secrets.TOURAPI_GUIDE }}
          TOURAPI_RATE: ${{ secrets.TOURAPI_RATE }}
          TOURAPI_MDC: ${{ secrets.TOURAPI_MDC }}
          TOURAPI_PET: ${{ secrets.TOURAPI_PET }}
          TOURAPI_TOUR: ${{ secrets.TOURAPI_TOUR }}
          TOURAPI_BASE_YM: ${{ vars.TOURAPI_BASE_YM || '202503' }}
          # Blog settings
          BLOG_POST_COUNT: ${{ vars.DAILY_POST_COUNT || '10' }}
          ENABLE_LLM_EDIT: ${{ vars.ENABLE_LLM_EDIT || 'true' }}
          ENABLE_IMAGE_GENERATION: ${{ vars.ENABLE_IMAGE_GENERATION || 'false' }}
          PUBLISHER: ${{ vars.PUBLISHER || 'markdown' }}
          BLOG_SITE_TITLE: ${{ vars.BLOG_SITE_TITLE || '브리핑웨이브' }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python -m blog_agent.cli run

      - name: Re-fetch missing cover images
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m blog_agent.cli re-image

      - name: Build static site
        env:
          BLOG_SITE_TITLE: ${{ vars.BLOG_SITE_TITLE || '브리핑웨이브' }}
          BLOG_CUSTOM_DOMAIN: ${{ vars.BLOG_CUSTOM_DOMAIN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
        run: python -m blog_agent.cli build-site

      - name: Commit generated drafts
        if: always()
        run: |
          git config user.name "blog-agent"
          git config user.email "actions@github.com"
          git add output state || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish daily blog drafts"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
