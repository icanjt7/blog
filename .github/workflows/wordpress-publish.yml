name: WordPress publish

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of posts to generate"
        required: false
        default: "1"
      status:
        description: "WordPress post status: draft or publish"
        required: false
        default: "publish"
      min_quality:
        description: "Minimum quality score"
        required: false
        default: "65"
  schedule:
    - cron: "30 15 * * *"

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Publish to WordPress
        env:
          # LLMs — first non-empty explicit key is used: Motif → Groq → Gemini → OpenAI.
          # GitHub Models is only a fallback because GITHUB_TOKEN is always present in Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'Llama-3.3-70B-Instruct' }}
          MOTIF_API: ${{ secrets.MOTIF_API }}
          MOTIF_MODEL: ${{ vars.MOTIF_MODEL || 'motif-12.7b-reasoning' }}
          MOTIF_BASE_URL: ${{ vars.MOTIF_BASE_URL || 'https://chat.motiftech.io/openapi/v1' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'groq/compound' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1-mini' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOURAPI_GUIDE: ${{ secrets.TOURAPI_GUIDE }}
          TOURAPI_RATE: ${{ secrets.TOURAPI_RATE }}
          TOURAPI_MDC: ${{ secrets.TOURAPI_MDC }}
          TOURAPI_PET: ${{ secrets.TOURAPI_PET }}
          TOURAPI_TOUR: ${{ secrets.TOURAPI_TOUR }}
          TOURAPI_TOUR_EN: ${{ secrets.TOURAPI_TOUR_EN }}
          TOURAPI_BASE_YM: ${{ vars.TOURAPI_BASE_YM || '202503' }}
          ENABLE_LLM_EDIT: ${{ vars.ENABLE_LLM_EDIT || 'true' }}
          ENABLE_IMAGE_GENERATION: ${{ vars.ENABLE_IMAGE_GENERATION || 'false' }}
          PUBLISHER: wordpress
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_STATUS: ${{ github.event.inputs.status || vars.WORDPRESS_STATUS || 'publish' }}
        run: |
          if [ -z "${WORDPRESS_URL}" ] || [ -z "${WORDPRESS_USERNAME}" ] || [ -z "${WORDPRESS_APP_PASSWORD}" ]; then
            echo "::notice::WordPress publish skipped because WORDPRESS_URL, WORDPRESS_USERNAME, or WORDPRESS_APP_PASSWORD is missing."
            mkdir -p output/reports
            cat > output/reports/wordpress-publish-skipped.json <<'JSON'
          {"ok": true, "skipped": true, "reason": "missing WordPress secrets"}
          JSON
            exit 0
          fi
          python -m blog_agent.cli run \
            --count "${{ github.event.inputs.count || vars.WORDPRESS_POST_COUNT || '1' }}" \
            --publisher wordpress \
            --min-quality "${{ github.event.inputs.min_quality || vars.WORDPRESS_MIN_QUALITY || '65' }}" \
            --require-publish-success

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-publish-run
          path: |
            state/*.json
            output/reports/*.json
          if-no-files-found: ignore

      - name: Commit run state
        if: always()
        run: |
          git config user.name "blog-agent"
          git config user.email "actions@github.com"
          git add state/*.json output/reports/*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: record wordpress publish run"
          git pull --rebase origin main
          git push
