name: Pages deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"   # 00:00 KST — daily sitemap refresh
  push:
    branches:
      - main
    paths:
      - "blog_agent/site.py"
      - "blog_agent/product_links.py"
      - "blog_agent/movie_pipeline.py"
      - "blog_agent/netflix_pipeline.py"
      - "blog_agent/templates/**"
      - "blog_agent/toss_products.json"
      - "data/movies-canary.json"
      - "data/netflix.jsonl"
      - "data/netflix-release-approval.json"
      - "output/movie-assets/**"
      - "scripts/verify_movie_canary.py"
      - "scripts/generate_netflix_fixture.py"
      - "scripts/verify_netflix_build.py"
      - "streamlit_app.py"
      - "output/posts/**"
      - ".github/workflows/pages-deploy.yml"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Restore incremental movie page cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/movie-pages
            .cache/netflix-pages
          key: ssg-pages-${{ runner.os }}-${{ hashFiles('blog_agent/site.py', 'blog_agent/movie_pipeline.py', 'blog_agent/netflix_pipeline.py', 'blog_agent/templates/*.html', 'data/movies-canary.json', 'blog_agent/toss_products.json') }}
          restore-keys: |
            ssg-pages-${{ runner.os }}-

      - name: Build site
        env:
          BLOG_SITE_TITLE: ${{ vars.BLOG_SITE_TITLE || '브리핑웨이브' }}
          BLOG_CUSTOM_DOMAIN: ${{ vars.BLOG_CUSTOM_DOMAIN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
        run: python -m blog_agent.cli build-site --movie-data data/movies-canary.json --movie-limit 10 --movie-mode staging

      - name: Verify 10-page movie canary, SEO, poster and Toss widget
        run: python scripts/verify_movie_canary.py --public-dir public --expected-count 10

      - name: Generate 50-page Netflix dry-run fixture
        run: python scripts/generate_netflix_fixture.py --output /tmp/netflix-canary.jsonl --count 50

      - name: Build Netflix 50-page multiprocessing canary
        run: python -m blog_agent.cli build-netflix --input /tmp/netflix-canary.jsonl --public-dir public --limit 50 --dry-run --chunk-size 10 | tee /tmp/netflix-build-stats.json

      - name: Verify Netflix SEO, spoiler UI, split sitemap and Toss widget
        run: python scripts/verify_netflix_build.py --public-dir public --expected 50 --dry-run --expected-sitemaps 5 --stats /tmp/netflix-build-stats.json

      - name: Build approved 20,000-page Netflix production dataset
        if: ${{ hashFiles('data/netflix.jsonl') != '' }}
        run: >-
          python -m blog_agent.cli build-netflix
          --input data/netflix.jsonl
          --public-dir public
          --chunk-size 1000
          --expected-count 20000
          --release-approval data/netflix-release-approval.json

      - name: Verify approved Netflix production pages
        if: ${{ hashFiles('data/netflix.jsonl') != '' }}
        run: python scripts/verify_netflix_build.py --public-dir public --expected 20000 --expected-sitemaps 20

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit sitemap to Google Search Console
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'https://briefwave.kr/' }}
          GOOGLE_SITEMAP_URL: ${{ vars.GOOGLE_SITEMAP_URL || 'https://briefwave.kr/sitemap.xml' }}
        run: python scripts/submit_google_sitemap.py
