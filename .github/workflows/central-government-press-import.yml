name: Central government press import

on:
  workflow_dispatch:
    inputs:
      per_agency:
        description: "Posts per agency"
        required: true
        default: "5"
      agencies:
        description: "Optional agency names/codes separated by spaces, e.g. 보건복지부 A00041"
        required: false
        default: ""
      max_agencies:
        description: "Optional limit for testing. 0 means all agencies"
        required: true
        default: "0"
      new_only:
        description: "Skip existing URLs and fill with new posts"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      dry_run:
        description: "Preview only, do not commit posts"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

concurrency:
  group: central-government-press-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Import central government press releases
        env:
          INPUT_PER_AGENCY: ${{ inputs.per_agency || '5' }}
          INPUT_AGENCIES: ${{ inputs.agencies || '' }}
          INPUT_MAX_AGENCIES: ${{ inputs.max_agencies || '0' }}
          INPUT_NEW_ONLY: ${{ inputs.new_only || 'true' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--per-agency "${INPUT_PER_AGENCY}")
          if [ -n "${INPUT_AGENCIES}" ]; then
            read -r -a agencies <<< "${INPUT_AGENCIES}"
            args+=(--agencies "${agencies[@]}")
          fi
          if [ "${INPUT_MAX_AGENCIES}" != "0" ]; then
            args+=(--max-agencies "${INPUT_MAX_AGENCIES}")
          fi
          if [ "${INPUT_NEW_ONLY}" = "true" ]; then
            args+=(--new-only)
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/import_korea_policy_press.py "${args[@]}"

      - name: Build static site
        if: ${{ inputs.dry_run != 'true' }}
        env:
          BLOG_SITE_TITLE: ${{ vars.BLOG_SITE_TITLE || '브리핑웨이브' }}
          BLOG_CUSTOM_DOMAIN: ${{ vars.BLOG_CUSTOM_DOMAIN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
        run: python -m blog_agent.cli build-site

      - name: Commit imported posts
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "blog-agent"
          git config user.email "actions@github.com"
          git add output/posts || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: import central government press releases"
          git pull --rebase --autostash origin main
          git push

      - uses: actions/configure-pages@v5
        if: ${{ inputs.dry_run != 'true' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.dry_run != 'true' }}
        with:
          path: public

      - uses: actions/deploy-pages@v4
        if: ${{ inputs.dry_run != 'true' }}
