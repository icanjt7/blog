name: Central government press import

on:
  schedule:
    # Daily 08:20 KST. GitHub cron uses UTC.
    - cron: "20 23 * * *"
  workflow_dispatch:
    inputs:
      per_agency:
        description: "Posts per agency"
        required: true
        default: "2"
      agencies:
        description: "Optional agency names/codes separated by spaces, e.g. 보건복지부 A00041"
        required: false
        default: ""
      sections:
        description: "Optional sections separated by spaces, e.g. 부처 청 위원회"
        required: false
        default: ""
      max_agencies:
        description: "Optional limit for testing. 0 means all agencies"
        required: true
        default: "0"
      scan_pages:
        description: "Press-list pages to scan per agency"
        required: true
        default: "20"
      start_date:
        description: "Import start date YYYY-MM-DD"
        required: false
        default: "2025-01-01"
      end_date:
        description: "Import end date YYYY-MM-DD. Empty means today"
        required: false
        default: ""
      new_only:
        description: "Skip existing URLs and fill with new posts"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      dry_run:
        description: "Preview only, do not commit posts"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      improve_existing_only:
        description: "Only replace weak images on existing press posts"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

concurrency:
  group: central-government-press-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Import central government press releases
        if: ${{ inputs.improve_existing_only != 'true' }}
        env:
          INPUT_PER_AGENCY: ${{ inputs.per_agency || '2' }}
          INPUT_SCAN_PAGES: ${{ inputs.scan_pages || '20' }}
          INPUT_AGENCIES: ${{ inputs.agencies || '' }}
          INPUT_SECTIONS: ${{ inputs.sections || '' }}
          INPUT_MAX_AGENCIES: ${{ inputs.max_agencies || '0' }}
          INPUT_START_DATE: ${{ inputs.start_date || '2025-01-01' }}
          INPUT_END_DATE: ${{ inputs.end_date || '' }}
          INPUT_NEW_ONLY: ${{ inputs.new_only || 'true' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          args=(--per-agency "${INPUT_PER_AGENCY}")
          args+=(--scan-pages "${INPUT_SCAN_PAGES}")
          if [ -n "${INPUT_AGENCIES}" ]; then
            read -r -a agencies <<< "${INPUT_AGENCIES}"
            args+=(--agencies "${agencies[@]}")
          fi
          if [ -n "${INPUT_SECTIONS}" ]; then
            read -r -a sections <<< "${INPUT_SECTIONS}"
            args+=(--sections "${sections[@]}")
          fi
          if [ "${INPUT_MAX_AGENCIES}" != "0" ]; then
            args+=(--max-agencies "${INPUT_MAX_AGENCIES}")
          fi
          args+=(--start-date "${INPUT_START_DATE}")
          if [ -n "${INPUT_END_DATE}" ]; then
            args+=(--end-date "${INPUT_END_DATE}")
          fi
          if [ "${INPUT_NEW_ONLY}" = "true" ]; then
            args+=(--new-only)
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python -u scripts/import_korea_policy_press.py "${args[@]}"

      - name: Improve weak press release images
        if: ${{ inputs.dry_run != 'true' }}
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/improve_existing_images.py --tag 보도기사 --limit 350

      - name: Build static site
        if: ${{ inputs.dry_run != 'true' }}
        env:
          BLOG_SITE_TITLE: ${{ vars.BLOG_SITE_TITLE || '브리핑웨이브' }}
          BLOG_CUSTOM_DOMAIN: ${{ vars.BLOG_CUSTOM_DOMAIN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
        run: python -m blog_agent.cli build-site

      - name: Commit imported posts
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "blog-agent"
          git config user.email "actions@github.com"
          git add output/posts || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: import central government press releases"
          git pull --rebase --autostash origin main
          git push

      - uses: actions/configure-pages@v5
        if: ${{ inputs.dry_run != 'true' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.dry_run != 'true' }}
        with:
          path: public

      - uses: actions/deploy-pages@v4
        if: ${{ inputs.dry_run != 'true' }}
