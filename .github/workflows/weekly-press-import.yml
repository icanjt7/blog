name: Weekly press release import

on:
  workflow_dispatch:
    inputs:
      per_source:
        description: "Posts per agency"
        required: true
        default: "12"
      agencies:
        description: "Optional agency codes separated by spaces, e.g. mois msit"
        required: false
        default: ""
      new_only:
        description: "Skip existing URLs and fill the requested number with new posts"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      overwrite_existing:
        description: "Refresh existing press-release posts from original attachments"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
  schedule:
    - cron: "0 1 * * 1"  # 매주 월요일 01:00 UTC (한국시간 10:00)

concurrency:
  group: press-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pages: write
      id-token: write
      models: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Import press releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'Llama-3.3-70B-Instruct' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'meta-llama/llama-3.1-8b-instruct:free' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          args=(--per-source "${{ inputs.per_source || '12' }}" --rewrite-titles)
          if [ -n "${{ inputs.agencies }}" ]; then
            args+=(--agencies ${{ inputs.agencies }})
          fi
          if [ "${{ inputs.new_only || 'false' }}" = "true" ]; then
            args+=(--new-only)
          fi
          if [ "${{ inputs.overwrite_existing || 'false' }}" = "true" ]; then
            args+=(--overwrite-existing)
          fi
          python scripts/import_press_releases.py "${args[@]}"

      - name: Build static site
        env:
          BLOG_SITE_TITLE: ${{ vars.BLOG_SITE_TITLE || '브리핑웨이브' }}
          BLOG_CUSTOM_DOMAIN: ${{ vars.BLOG_CUSTOM_DOMAIN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
        run: python -m blog_agent.cli build-site

      - name: Commit imported posts
        run: |
          git config user.name "blog-agent"
          git config user.email "actions@github.com"
          git add output state || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly press release import"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
