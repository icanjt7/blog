name: Six agency press release import

on:
  workflow_dispatch:
    inputs:
      per_source:
        description: "Posts per agency"
        required: true
        default: "3"
      agencies:
        description: "Optional agency codes separated by spaces, e.g. mois msit"
        required: false
        default: ""
      new_only:
        description: "Skip existing URLs and fill the requested number with new posts"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      overwrite_existing:
        description: "Refresh existing press-release posts from original attachments"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
  schedule:
    # 주간 보충 수집. 일일 수집과 중복 실행하지 않도록 일요일에만 실행합니다.
    - cron: "0 0 * * 0"

concurrency:
  group: press-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      models: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Import press releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'Llama-3.3-70B-Instruct' }}
          MOTIF_API: ${{ secrets.MOTIF_API }}
          MOTIF_MODEL: ${{ vars.MOTIF_MODEL || 'motif-12.7b-reasoning' }}
          MOTIF_BASE_URL: ${{ vars.MOTIF_BASE_URL || 'https://chat.motiftech.io/openapi/v1' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'groq/compound' }}
          NVIDIA_API_KEY: ${{ secrets.LLAMA }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'meta/llama-3.3-70b-instruct' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'meta-llama/llama-3.1-8b-instruct:free' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INPUT_PER_SOURCE: ${{ inputs.per_source || '3' }}
          INPUT_AGENCIES: ${{ inputs.agencies || '' }}
          INPUT_NEW_ONLY: ${{ inputs.new_only || 'true' }}
          INPUT_OVERWRITE_EXISTING: ${{ inputs.overwrite_existing || 'false' }}
        run: |
          args=(--per-source "${INPUT_PER_SOURCE}" --rewrite-titles)
          if [ -n "${INPUT_AGENCIES}" ]; then
            read -r -a agencies <<< "${INPUT_AGENCIES}"
            args+=(--agencies "${agencies[@]}")
          fi
          if [ "${INPUT_NEW_ONLY}" = "true" ]; then
            args+=(--new-only)
          fi
          if [ "${INPUT_OVERWRITE_EXISTING}" = "true" ]; then
            args+=(--overwrite-existing)
          fi
          python scripts/import_press_releases.py "${args[@]}"

      - name: Commit imported posts
        run: |
          git config user.name "blog-agent"
          git config user.email "actions@github.com"
          git add output state || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly press release import"
          git pull --rebase --autostash origin main
          git push
