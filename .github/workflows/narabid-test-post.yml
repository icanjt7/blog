name: Nara Bid service posts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of service bid notices to include"
        required: false
        default: "20"
      days:
        description: "Lookback days"
        required: false
        default: "1"
  schedule:
    - cron: "20 22 * * *"  # 07:20 KST daily

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BIDPUBLICINFOSERVICE: ${{ secrets.BIDPUBLICINFOSERVICE }}
      BLOG_SITE_TITLE: ${{ vars.BLOG_SITE_TITLE || '브리핑웨이브' }}
      BLOG_CUSTOM_DOMAIN: ${{ vars.BLOG_CUSTOM_DOMAIN }}
      GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
      ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Generate Nara Bid markdown
        run: |
          status=1
          for attempt in 1 2 3; do
            if python scripts/generate_narabid_post.py \
              --format service-summary \
              --work-types service \
              --limit "${{ github.event.inputs.limit || '20' }}" \
              --days "${{ github.event.inputs.days || '1' }}" \
              --overwrite; then
              status=0
              break
            fi
            echo "::warning::나라장터 API 호출 실패 (${attempt}/3)"
            sleep $((attempt * 5))
          done
          if [ "${status}" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::warning::나라장터 API 일시 장애로 생성을 건너뜁니다. 다음 예약 실행에서 다시 시도합니다."
            else
              exit "${status}"
            fi
          fi

      - name: Build site
        run: python -m blog_agent.cli build-site

      - name: Commit generated Nara Bid service post
        run: |
          git config user.name "blog-agent"
          git config user.email "actions@github.com"
          git add output/posts
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish Nara Bid service post"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
