name: Hybrid publish

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of posts to generate"
        required: false
        default: "1"
      wordpress_status:
        description: "WordPress post status: draft or publish"
        required: false
        default: "publish"
      min_quality:
        description: "Minimum quality score"
        required: false
        default: "65"
  schedule:
    - cron: "45 15 * * *"

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pages: write
      id-token: write
      models: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Generate posts and publish to WordPress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'Llama-3.3-70B-Instruct' }}
          MOTIF_API: ${{ secrets.MOTIF_API }}
          MOTIF_MODEL: ${{ vars.MOTIF_MODEL || 'motif-12.7b-reasoning' }}
          MOTIF_BASE_URL: ${{ vars.MOTIF_BASE_URL || 'https://chat.motiftech.io/openapi/v1' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'groq/compound' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOURAPI_GUIDE: ${{ secrets.TOURAPI_GUIDE }}
          TOURAPI_RATE: ${{ secrets.TOURAPI_RATE }}
          TOURAPI_MDC: ${{ secrets.TOURAPI_MDC }}
          TOURAPI_PET: ${{ secrets.TOURAPI_PET }}
          TOURAPI_TOUR: ${{ secrets.TOURAPI_TOUR }}
          TOURAPI_TOUR_EN: ${{ secrets.TOURAPI_TOUR_EN }}
          TOURAPI_BASE_YM: ${{ vars.TOURAPI_BASE_YM || '202503' }}
          ENABLE_LLM_EDIT: ${{ vars.ENABLE_LLM_EDIT || 'true' }}
          ENABLE_IMAGE_GENERATION: ${{ vars.ENABLE_IMAGE_GENERATION || 'false' }}
          PUBLISHER: both
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_STATUS: ${{ github.event.inputs.wordpress_status || vars.WORDPRESS_STATUS || 'publish' }}
        run: |
          python -m blog_agent.cli run \
            --count "${{ github.event.inputs.count || vars.HYBRID_POST_COUNT || '1' }}" \
            --publisher both \
            --min-quality "${{ github.event.inputs.min_quality || vars.HYBRID_MIN_QUALITY || '65' }}" \
            --require-publish-success

      - name: Build GitHub Pages site
        env:
          BLOG_SITE_TITLE: ${{ vars.BLOG_SITE_TITLE || '브리핑웨이브' }}
          BLOG_CUSTOM_DOMAIN: ${{ vars.BLOG_CUSTOM_DOMAIN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
        run: python -m blog_agent.cli build-site

      - name: Commit generated content and run state
        if: always()
        run: |
          git config user.name "blog-agent"
          git config user.email "actions@github.com"
          git add output state || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish hybrid blog content"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
